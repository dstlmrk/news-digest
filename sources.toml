# Hacker News přes hnrss.org s filtrem na 100+ bodů, aby chodily jen
# příspěvky, které si komunita opravdu všimla. Obsah je anglicky — do
# digestu se píše česky, viz CLAUDE.md.
[[feeds]]
source = "hackernews"
name = "Hacker News"
url = "https://hnrss.org/frontpage?points=100"
section = "tech"
kind = "breaking"
weight = 1.0

# Oficiální blog Claude/Anthropic. Nemá RSS — položky se parsují z HTML
# výpisu (type = "claude_blog"). Nesou jen titulek a datum bez času a bez
# anotace, k napsání zprávy je potřeba otevřít článek.
[[feeds]]
source = "claudeblog"
name = "Claude Blog"
url = "https://claude.com/blog"
section = "tech"
kind = "breaking"
weight = 1.1
type = "claude_blog"


