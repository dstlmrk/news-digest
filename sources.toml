# Zdroje pro odpolední digest.
#
# Tenhle soubor čte scripts/fetch_feeds.py. Uprav ho, kdykoli chceš přidat,
# odebrat nebo převážit zdroj — nic jiného se kvůli tomu měnit nemusí.
#
# weight  = násobič důvěryhodnosti/relevance (1.0 = normální). Používá se jako
#           signál při řazení, ne jako tvrdé pravidlo.
# section = "news" | "sport" | "tech" | "hradec". Určuje, do které části
#           digestu položka spadá.
# kind    = "breaking" (běžné zpravodajství) | "longform" (analýzy, komentáře)
# assume_tz = IANA zóna pro feedy, které posílají pubDate bez časové zóny
#           (jinak se předpokládá UTC).
# type    = "claude_blog" pro claude.com/blog (parsuje se HTML výpis,
#           protože blog nemá RSS). Bez type se čte jako RSS/Atom.

[settings]
# Časové okno, ze kterého se berou zprávy (v hodinách). Routina běží
# v 17:00, takže okno sahá do 17:00 předchozího dne.
window_hours = 24
# Práh podobnosti titulků pro spojení téže zprávy z více portálů (0–1).
cluster_threshold = 0.30
# Timeout na jeden feed (sekundy).
timeout = 20


# ─────────────────────────────  ZPRAVODAJSTVÍ  ─────────────────────────────

